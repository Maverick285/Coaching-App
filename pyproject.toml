[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "buddy"
version = "0.1.0"
description = "Personal AI companion backend (Phase 0) — markdown-memory, calibrated persona, two-tier LLM routing."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Maverick" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.19",
    "alembic>=1.13",
    "sqlite-vec>=0.1.6",
    "apscheduler>=3.10",
    "anthropic>=0.39",
    "openai>=1.40",
    "GitPython>=3.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "tiktoken>=0.7",
    "watchdog>=4.0",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-requests",
]
cli = [
    "click>=8.1",
    "rich>=13.7",
    "tomli>=2.0",
    "tomli_w>=1.0",
]

[project.scripts]
buddy = "buddy_cli.main:cli"

[tool.setuptools.packages.find]
where = ["src", "cli"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
